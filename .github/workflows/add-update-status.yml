name: Add userscript update status

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-update-status.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch userscript
        run: python3 .github/scripts/add_update_status.py

      - name: Validate and commit
        run: |
          node --check park-erp-viewer.user.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/add-update-status.yml
          git rm .github/scripts/add_update_status.py
          git add park-erp-viewer.user.js
          git commit -m 'feat: show available userscript updates'
          git push
