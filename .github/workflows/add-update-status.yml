name: Add userscript update status

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-update-status.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update userscript
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('park-erp-viewer.user.js')
          text = path.read_text(encoding='utf-8')

          text = text.replace('// @version      6.3.8', '// @version      6.3.9', 1)
          text = text.replace(
              '<span class="attendance-viewer-version">v6.3.8</span>',
              '''<span class="attendance-viewer-version">v6.3.9</span>
                        <a
                            id="attendance-viewer-update-link"
                            class="attendance-viewer-update-link"
                            href="https://greasyfork.org/ko/scripts/589938-park-erp-%EA%B7%BC%ED%83%9C-%EB%A7%9E%EC%B6%A4-%EB%B3%B4%EA%B8%B0"
                            target="_blank"
                            rel="noopener noreferrer"
                            hidden></a>''',
              1
          )

          text = text.replace(
              '    const STYLE_ID = "attendance-viewer-style";\n',
              '''    const STYLE_ID = "attendance-viewer-style";
    const CURRENT_VERSION = "6.3.9";
    const LATEST_SCRIPT_URL =
        "https://raw.githubusercontent.com/higwon/park-erp-viewer/main/park-erp-viewer.user.js";
''',
              1
          )

          text = text.replace(
              '    let attendanceRecords = [];\n',
              '''    let attendanceRecords = [];
    let updateCheckStarted = false;
''',
              1
          )

          old_ensure = '''    function ensureUserInterface() {
        createStyles();
        createButton();
        createPanel();
    }
'''
          new_ensure = '''    function ensureUserInterface() {
        createStyles();
        createButton();
        createPanel();
        checkForUpdates();
    }

    async function checkForUpdates() {
        if (updateCheckStarted) {
            return;
        }

        updateCheckStarted = true;

        try {
            const response = await fetch(
                `${LATEST_SCRIPT_URL}?timestamp=${Date.now()}`,
                { cache: "no-store" }
            );

            if (!response.ok) {
                return;
            }

            const source = await response.text();
            const latestVersion = source.match(
                /^\/\/\s*@version\s+([^\s]+)$/m
            )?.[1];

            if (
                !latestVersion ||
                compareVersions(latestVersion, CURRENT_VERSION) <= 0
            ) {
                return;
            }

            const updateLink = document.getElementById(
                "attendance-viewer-update-link"
            );

            if (!updateLink) {
                return;
            }

            updateLink.textContent = `업데이트 v${latestVersion}`;
            updateLink.hidden = false;
        } catch (error) {
            console.debug(
                "[근태 맞춤 보기] 최신 버전 확인 실패",
                error
            );
        }
    }

    function compareVersions(left, right) {
        const leftParts = String(left)
            .split(".")
            .map(part => Number(part) || 0);
        const rightParts = String(right)
            .split(".")
            .map(part => Number(part) || 0);
        const length = Math.max(leftParts.length, rightParts.length);

        for (let index = 0; index < length; index++) {
            const difference =
                (leftParts[index] ?? 0) -
                (rightParts[index] ?? 0);

            if (difference !== 0) {
                return difference;
            }
        }

        return 0;
    }
'''
          if old_ensure not in text:
              raise SystemExit('ensureUserInterface block not found')
          text = text.replace(old_ensure, new_ensure, 1)

          marker = '''            .attendance-viewer-header-actions {
'''
          css = '''            .attendance-viewer-update-link {
                display: inline-flex;
                align-items: center;
                min-height: 20px;
                padding: 2px 7px;
                border: 1px solid #f1d49a;
                border-radius: 999px;
                background: #fff8e8;
                color: #9a6500;
                font-size: 10px;
                font-weight: 700;
                line-height: 1.3;
                text-decoration: none;
                white-space: nowrap;
            }

            .attendance-viewer-update-link:hover {
                border-color: #e4bd6d;
                background: #fff1cf;
            }

            .attendance-viewer-update-link[hidden] {
                display: none;
            }

'''
          if marker not in text:
              raise SystemExit('header actions css marker not found')
          text = text.replace(marker, css + marker, 1)

          path.write_text(text, encoding='utf-8')
          PY

          node --check park-erp-viewer.user.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/add-update-status.yml
          git add park-erp-viewer.user.js
          git commit -m 'feat: show available userscript updates'
          git push
