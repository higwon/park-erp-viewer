name: Apply attendance dashboard

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-attendance-dashboard.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply UI patch
        run: python3 .github/apply_ui_patch.py

      - name: Validate userscript
        run: node --check park-erp-viewer.user.js

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-attendance-dashboard.yml
          git rm .github/apply_ui_patch.py
          git add park-erp-viewer.user.js
          git commit -m 'feat: redesign attendance summary dashboard'
          git push
