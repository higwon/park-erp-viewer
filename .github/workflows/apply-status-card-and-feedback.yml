name: Apply status card and feedback link

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-status-card-and-feedback.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch userscript
        run: python3 .github/scripts/apply-status-card-and-feedback.py
      - name: Validate userscript
        run: node --check park-erp-viewer.user.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-status-card-and-feedback.yml
          git rm .github/scripts/apply-status-card-and-feedback.py
          git add park-erp-viewer.user.js
          git commit -m 'feat: add status-aware attendance card and feedback link'
          git push
