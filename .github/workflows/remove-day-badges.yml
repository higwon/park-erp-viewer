name: Remove day badges

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/remove-day-badges.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply cleanup
        run: |
          python3 .github/scripts/remove_day_badges.py
          node --check park-erp-viewer.user.js

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/remove-day-badges.yml
          git rm .github/scripts/remove_day_badges.py
          git add park-erp-viewer.user.js
          git commit -m 'fix: simplify today summary and remove day badges'
          git push
