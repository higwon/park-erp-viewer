name: Add update refresh hint

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-update-refresh-hint.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/add_update_refresh_hint.py
      - run: node --check park-erp-viewer.user.js
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/add-update-refresh-hint.yml .github/add_update_refresh_hint.py
          git add park-erp-viewer.user.js
          git commit -m 'feat: show refresh hint next to update link'
          git push
