name: Add attendance web link

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/add_web_link.py
      - run: node --check park-erp-viewer.user.js
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/add-web-link.yml scripts/add_web_link.py
          git add park-erp-viewer.user.js
          git commit -m "feat: add direct attendance web link"
          git push
