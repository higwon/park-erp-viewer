name: Add attendance web link

'on':
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch userscript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('park-erp-viewer.user.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('// @version      6.3.6', '// @version      6.3.7', 1)
          s = s.replace('v6.3.6</span>', 'v6.3.7</span>', 1)
          old = '''                <button
                    id="attendance-viewer-close"
                    type="button"
                    aria-label="닫기">
                    ×
                </button>
'''
          new = '''                <div class="attendance-viewer-header-actions">
                    <a
                        class="attendance-viewer-web-link"
                        href="https://attendance-tracker.higwon2.workers.dev/"
                        target="_blank"
                        rel="noopener noreferrer">
                        직접 기록하기 <span aria-hidden="true">↗</span>
                    </a>

                    <button
                        id="attendance-viewer-close"
                        type="button"
                        aria-label="닫기">
                        ×
                    </button>
                </div>
'''
          if old not in s:
              raise SystemExit('close button block not found')
          s = s.replace(old, new, 1)
          marker = '            #attendance-viewer-close {\n'
          css = '''            .attendance-viewer-header-actions {
                display: flex;
                align-items: center;
                gap: 8px;
                flex: 0 0 auto;
            }

            .attendance-viewer-web-link {
                display: inline-flex;
                align-items: center;
                gap: 4px;
                height: 30px;
                padding: 0 10px;
                border: 1px solid #d5e3dc;
                border-radius: 8px;
                background: #f7faf8;
                color: #17795b;
                font-size: 12px;
                font-weight: 700;
                text-decoration: none;
                white-space: nowrap;
            }

            .attendance-viewer-web-link:hover {
                border-color: #b9d5c8;
                background: #eef7f3;
            }

'''
          if marker not in s:
              raise SystemExit('close css marker not found')
          s = s.replace(marker, css + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
          node --check park-erp-viewer.user.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/add-web-link.yml
          git add park-erp-viewer.user.js
          git commit -m "feat: add direct attendance web link"
          git push
