name: Fix update link pointer events

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-update-link-pointer-events.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('park-erp-viewer.user.js'); s=p.read_text(encoding='utf-8'); s=s.replace('// @version      6.3.12','// @version      6.3.13',1).replace('const CURRENT_VERSION = \"6.3.12\";','const CURRENT_VERSION = \"6.3.13\";',1).replace('<span class=\"attendance-viewer-version\">현재 v6.3.12</span>','<span class=\"attendance-viewer-version\">현재 v6.3.13</span>',1).replace('                pointer-events: none;\n','',1); p.write_text(s,encoding='utf-8')"
          node --check park-erp-viewer.user.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/fix-update-link-pointer-events.yml
          git add park-erp-viewer.user.js
          git commit -m "fix: enable update link pointer events"
          git push
