name: Fix attendance web link click

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-web-link-click.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch userscript
        run: |
          sed -i 's/@version      6.3.7/@version      6.3.8/' park-erp-viewer.user.js
          sed -i 's/v6.3.7/v6.3.8/' park-erp-viewer.user.js
          sed -i 's/event.target.closest("button")/event.target.closest("button, a")/' park-erp-viewer.user.js
          node --check park-erp-viewer.user.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-web-link-click.yml
          git add park-erp-viewer.user.js
          git commit -m 'fix: allow attendance web link clicks'
          git push
