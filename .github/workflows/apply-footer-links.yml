name: Apply footer links

on:
  push:
    paths:
      - .github/workflows/apply-footer-links.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply footer patch
        run: python .github/scripts/apply-footer-links.py

      - name: Validate userscript syntax
        run: node --check park-erp-viewer.user.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add park-erp-viewer.user.js
          git commit -m "feat: add personal site and bug report footer links"
          git push
