name: Add version badge

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-version-badge.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add small version badge
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('park-erp-viewer.user.js')
          text = path.read_text(encoding='utf-8')

          text = text.replace('// @version      6.3.2', '// @version      6.3.3', 1)

          old_title = '''                    <strong>내 출퇴근 기록</strong>'''
          new_title = '''                    <div class="attendance-viewer-title-row">\n                        <strong>내 출퇴근 기록</strong>\n                        <span class="attendance-viewer-version">v6.3.3</span>\n                    </div>'''

          if old_title not in text:
              raise SystemExit('title marker not found')

          text = text.replace(old_title, new_title, 1)

          old_css = '''            .attendance-viewer-header strong {\n                color: #17201c;\n                font-size: 20px;\n            }\n'''
          new_css = '''            .attendance-viewer-title-row {\n                display: flex;\n                align-items: center;\n                gap: 8px;\n            }\n\n            .attendance-viewer-header strong {\n                color: #17201c;\n                font-size: 20px;\n            }\n\n            .attendance-viewer-version {\n                display: inline-flex;\n                align-items: center;\n                height: 20px;\n                padding: 0 7px;\n                border: 1px solid #dfe6e2;\n                border-radius: 999px;\n                background: #f5f8f6;\n                color: #7b8781;\n                font-size: 11px;\n                font-weight: 600;\n                line-height: 1;\n            }\n'''

          if old_css not in text:
              raise SystemExit('css marker not found')

          text = text.replace(old_css, new_css, 1)
          path.write_text(text, encoding='utf-8')
          PY

          node --check park-erp-viewer.user.js

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/add-version-badge.yml
          git add park-erp-viewer.user.js .github/workflows/add-version-badge.yml
          git commit -m 'feat: display userscript version in panel header'
          git push
