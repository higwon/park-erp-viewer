name: Bump userscript version to 6.3.12

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bump-version-6-3-12.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('park-erp-viewer.user.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace('// @version      6.3.11', '// @version      6.3.12', 1)
          text = text.replace('const CURRENT_VERSION = "6.3.11";', 'const CURRENT_VERSION = "6.3.12";', 1)
          text = text.replace('현재 v6.3.11', '현재 v6.3.12', 1)
          path.write_text(text, encoding='utf-8')
          PY
          node --check park-erp-viewer.user.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/bump-version-6-3-12.yml
          git add park-erp-viewer.user.js
          git commit -m 'chore: bump userscript version to 6.3.12'
          git push
