name: Apply simple dashboard fixes

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-simple-dashboard-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update userscript UI
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('park-erp-viewer.user.js')
          text = path.read_text(encoding='utf-8')

          text = text.replace('// @version      6.3.4', '// @version      6.3.5', 1)
          text = text.replace('<span class="attendance-viewer-version">v6.3.4</span>', '<span class="attendance-viewer-version">v6.3.5</span>', 1)

          start = text.index('    function createTodayStatus(summary) {')
          end = text.index('\n\n    function bindDepartureInfoEvent()', start)

          new_today = r'''    function createTodayStatus(summary) {
        const isWorking =
            Boolean(summary.todayRecord?.checkInTime) &&
            !summary.todayRecord?.checkOutTime &&
            !summary.todayRecord?.isHoliday &&
            (
                !summary.todayRecord?.isVacation ||
                summary.todayRecord?.isHalfDay
            );

        const todaySubtitle = isWorking
            ? `현재 근무시간 ${formatMinutes(
                summary.todayWorkMinutes
            )} · ${
                summary.canLeaveNow
                    ? "지금 퇴근 가능"
                    : `${summary.availableCheckOutTime}부터 퇴근 가능`
            }`
            : summary.description;

        const readyBadge = summary.canLeaveNow
            ? `<em>지금 퇴근 가능</em>`
            : "";

        return `
            <section class="attendance-today">
                <div class="attendance-today-title">
                    <div>
                        <span class="attendance-today-eyebrow">
                            오늘
                        </span>

                        <strong>
                            ${escapeHtml(summary.title)}
                        </strong>

                        <p class="attendance-today-summary">
                            ${escapeHtml(todaySubtitle)}
                        </p>
                    </div>

                    <span class="attendance-today-badge ${summary.badgeClass}">
                        ${escapeHtml(summary.badge)}
                    </span>
                </div>

                <div class="attendance-today-cards">
                    ${createTodayCard(
                        "이번주 근무시간",
                        formatMinutes(
                            summary.weeklyWorkMinutes
                        )
                    )}

                    ${createTodayCard(
                        "이번주 초과근무",
                        formatSignedMinutes(
                            summary.weeklyOvertimeMinutes
                        ),
                        getTimeStateClass(
                            summary.weeklyOvertimeMinutes
                        )
                    )}

                    ${createTodayCard(
                        "이번주 필요근무",
                        formatMinutes(
                            summary.weeklyRequiredMinutes
                        )
                    )}

                    <article class="attendance-today-card attendance-departure-card ${
                        summary.canLeaveNow
                            ? "is-ready"
                            : ""
                    }">
                        <div class="attendance-departure-heading">
                            <span>퇴근 가능시간</span>

                            <button
                                type="button"
                                class="attendance-departure-info"
                                aria-label="퇴근 가능시간 계산 정보"
                                aria-expanded="false">
                                i
                            </button>
                        </div>

                        <div class="attendance-departure-value">
                            <strong class="${
                                summary.canLeaveNow
                                    ? "is-positive"
                                    : summary.availableCheckOutClass
                            }">
                                ${escapeHtml(
                                    summary.availableCheckOutTime
                                )}
                            </strong>

                            ${readyBadge}
                        </div>

                        <div class="attendance-departure-details">
                            <div>
                                ${
                                    summary.todayRecord &&
                                    summary.todayRecord.workDate ===
                                        summary.lastWorkDate
                                        ? `
                                            <aside class="attendance-departure-guide">
                                                <strong>
                                                    오늘은 이번 주 마지막 근무일입니다.
                                                </strong>
                                                <span>
                                                    이번 주 남은 필요 근무시간을 적용했습니다.
                                                </span>
                                            </aside>

                                            <p>
                                                <span>이번 주 필요 근무시간</span>
                                                <b>${formatMinutes(
                                                    summary.weeklyRequiredMinutes
                                                )}</b>
                                            </p>

                                            <p>
                                                <span>누적 근무시간</span>
                                                <b>
                                                    ${formatMinutes(
                                                        summary.priorWorkMinutes
                                                    )}
                                                    <em class="${getTimeStateClass(
                                                        summary.priorOvertimeMinutes
                                                    )}">
                                                        ${formatSignedMinutes(
                                                            summary.priorOvertimeMinutes
                                                        )}
                                                    </em>
                                                </b>
                                            </p>

                                            <p>
                                                <span>오늘 필요 근무시간</span>
                                                <b>${formatMinutes(
                                                    summary.requiredTodayMinutes
                                                )}</b>
                                            </p>

                                            <p>
                                                <span>오늘 출근시간</span>
                                                <b>${
                                                    summary.todayRecord?.checkInTime ??
                                                    "--:--"
                                                }</b>
                                            </p>

                                            <p>
                                                <span>최종 퇴근 가능시간</span>
                                                <b>${escapeHtml(
                                                    summary.availableCheckOutTime
                                                )}</b>
                                            </p>
                                        `
                                        : `
                                            <aside class="attendance-departure-guide">
                                                <strong>
                                                    오늘은 출근 시간부터 ${formatMinutes(
                                                        summary.requiredTodayMinutes
                                                    )} 근무 기준입니다.
                                                </strong>
                                            </aside>

                                            <p>
                                                <span>출근시간</span>
                                                <b>${
                                                    summary.todayRecord?.checkInTime ??
                                                    "--:--"
                                                }</b>
                                            </p>

                                            <p>
                                                <span>필요 근무시간</span>
                                                <b>${formatMinutes(
                                                    summary.requiredTodayMinutes
                                                )}</b>
                                            </p>

                                            <p>
                                                <span>퇴근 가능시간</span>
                                                <b>${escapeHtml(
                                                    summary.availableCheckOutTime
                                                )}</b>
                                            </p>
                                        `
                                }
                            </div>
                        </div>
                    </article>
                </div>
            </section>
        `;
    }'''

          text = text[:start] + new_today + text[end:]

          old_row = '''                <div class="attendance-day-date">
                    <strong>${formatMonthDay(record.workDate)}</strong>
                    <span>${escapeHtml(record.weekName)}</span>
                </div>

                <div class="attendance-day-time">
                    <strong>${escapeHtml(mainText)}</strong>
                    <span>${escapeHtml(statusText)}</span>
                </div>
'''
          new_row = '''                <div class="attendance-day-date">
                    <strong>${formatMonthDay(record.workDate)}</strong>
                    <span>${escapeHtml(record.weekName)}</span>
                    ${createDayBadges(record, todayKey)}
                </div>

                <div class="attendance-day-time">
                    <strong>${escapeHtml(mainText)}</strong>
                    <span>${escapeHtml(statusText)}</span>
                </div>
'''
          if old_row not in text:
              raise SystemExit('day row block not found')
          text = text.replace(old_row, new_row, 1)

          marker = '''    function createWeekTitle(startDate, endDate) {
'''
          helpers = r'''    function createDayBadges(record, todayKey) {
        const badges = [];
        const primaryLabel = getPrimaryBadgeLabel(record);

        if (primaryLabel) {
            badges.push({
                label: primaryLabel,
                className: getPrimaryBadgeClass(record)
            });
        }

        if (record.workDate === todayKey) {
            const isWorking =
                Boolean(record.checkInTime) &&
                !record.checkOutTime &&
                !record.isHoliday &&
                (!record.isVacation || record.isHalfDay);

            if (isWorking) {
                badges.push({
                    label: "근무 중",
                    className: "is-current"
                });
            }
        }

        if (badges.length === 0) {
            return "";
        }

        return `
            <span class="attendance-day-badges">
                ${badges
                    .map(
                        badge => `
                            <em class="attendance-day-badge ${badge.className}">
                                ${escapeHtml(badge.label)}
                            </em>
                        `
                    )
                    .join("")}
            </span>
        `;
    }

    function getPrimaryBadgeLabel(record) {
        if (record.isHoliday || record.isVacation) {
            return getNonWorkingLabel(record);
        }

        return record.workItem || record.status || "";
    }

    function getPrimaryBadgeClass(record) {
        if (record.isHoliday) {
            return "is-holiday";
        }

        if (record.isVacation) {
            return "is-vacation";
        }

        return "is-working";
    }

'''
          if marker not in text:
              raise SystemExit('helper insert marker not found')
          text = text.replace(marker, helpers + marker, 1)

          css_marker = '''            @media (max-width: 900px) {
'''
          css = r'''            /* Simplified modern dashboard */
            .attendance-today {
                padding: 16px;
                border-radius: 16px;
                box-shadow: none;
            }

            .attendance-today-title {
                align-items: flex-start;
                gap: 14px;
                margin-bottom: 14px;
            }

            .attendance-today-title strong {
                font-size: 18px;
                line-height: 1.2;
                letter-spacing: -0.02em;
            }

            .attendance-today-summary {
                margin: 6px 0 0 !important;
                color: #69756f !important;
                font-size: 13px !important;
                line-height: 1.5;
            }

            .attendance-today-badge {
                padding: 6px 10px;
                font-size: 12px;
            }

            .attendance-today-badge.is-working::before {
                display: none;
            }

            .attendance-today-cards {
                gap: 10px;
            }

            .attendance-today-card {
                min-height: 74px;
                padding: 13px 14px;
                border-radius: 13px;
                background: #ffffff;
                box-shadow: none;
            }

            .attendance-card-heading {
                display: block;
                margin: 0;
            }

            .attendance-card-icon {
                display: none !important;
            }

            .attendance-today-card span {
                margin-bottom: 7px;
                font-size: 12px;
            }

            .attendance-today-card strong {
                font-size: 18px;
            }

            .attendance-departure-card {
                min-height: 74px;
                padding-top: 13px;
            }

            .attendance-departure-heading {
                margin-bottom: 7px;
            }

            .attendance-departure-heading > span::before {
                display: none;
                content: none;
            }

            .attendance-departure-details {
                width: 300px;
                padding: 12px;
                font-size: 12px;
            }

            .attendance-departure-guide strong {
                font-size: 12px;
                line-height: 1.45;
            }

            .attendance-departure-guide span {
                font-size: 11px;
                line-height: 1.5;
            }

            .attendance-departure-details p,
            .attendance-departure-details p b,
            .attendance-departure-details p b em {
                font-size: 11px;
                line-height: 1.45;
            }

            .attendance-day-date {
                align-items: center;
                flex-wrap: wrap;
            }

            .attendance-day-badges {
                display: inline-flex;
                flex-wrap: wrap;
                gap: 6px;
                margin-left: 4px;
            }

            .attendance-day-badge {
                display: inline-flex;
                align-items: center;
                min-height: 22px;
                padding: 0 9px;
                border: 1px solid #dde5e1;
                border-radius: 999px;
                background: #f8faf9;
                color: #5f6d66;
                font-size: 11px;
                font-style: normal;
                font-weight: 700;
                line-height: 20px;
                white-space: nowrap;
            }

            .attendance-day-badge.is-working {
                background: #f5f7f6;
                color: #50605a;
            }

            .attendance-day-badge.is-current {
                border-color: #cbe8da;
                background: #eaf8f1;
                color: #17795b;
            }

            .attendance-day-badge.is-vacation,
            .attendance-day-badge.is-holiday {
                border-color: #f0dfb3;
                background: #fffbf1;
                color: #9a6a10;
            }

'''
          if css_marker not in text:
              raise SystemExit('CSS insert marker not found')
          text = text.replace(css_marker, css + css_marker, 1)

          path.write_text(text, encoding='utf-8')
          PY

          node --check park-erp-viewer.user.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-simple-dashboard-fixes.yml
          git add park-erp-viewer.user.js
          git commit -m 'fix: simplify attendance dashboard styling'
          git push
