name: Apply simple dashboard fixes

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-simple-dashboard-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update userscript UI
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          node --check park-erp-viewer.user.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-simple-dashboard-fixes.yml
          git add park-erp-viewer.user.js
          git commit -m 'fix: simplify attendance dashboard styling'
          git push
