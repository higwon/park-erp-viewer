name: Improve userscript update link

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/improve-update-link.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/improve_update_link.py
      - run: node --check park-erp-viewer.user.js
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/improve-update-link.yml .github/improve_update_link.py
          git add park-erp-viewer.user.js
          git commit -m 'fix: clarify and enable userscript update link'
          git push
